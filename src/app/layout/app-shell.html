<div class="app-frame">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <button class="mobile-backdrop" [class.show]="mobileOpen()" (click)="mobileOpen.set(false)" aria-label="Close menu"></button>
  <aside class="sidebar" [class.open]="mobileOpen()">
    <div class="workspace-label"><span>Your workspace</span><button aria-label="Workspace notifications"><ui-icon name="bell" [size]="18"/></button></div>
    <section class="user-card"><span class="profile-avatar">JS</span><strong>John Smith</strong><small>Administrator</small><div class="company-card"><span>TC</span><div><small>Company</small><b>Titan Consultancy &amp; Services</b></div></div></section>
    <nav aria-label="Primary navigation">
      @for(group of navGroups;track group.label){<div class="nav-group"><p>{{group.label}}</p>@for(item of group.items;track item[1]){<a [routerLink]="item[2]" routerLinkActive="active" (click)="mobileOpen.set(false)"><ui-icon [name]="item[0]" [size]="20"/><span>{{item[1]}}</span></a>}</div>}
    </nav>
    <a routerLink="/dashboard" class="side-brand" (click)="mobileOpen.set(false)"><span class="logo-mark"><i></i><b></b></span><span><strong>TITAN</strong><em>ENGAGE</em></span></a>
  </aside>
  <div class="workspace">
    <header class="mobile-topbar"><button class="menu-btn" (click)="mobileOpen.set(true)" aria-label="Open menu"><ui-icon name="menu" [size]="22"/></button><a routerLink="/dashboard"><b>TITAN</b> <span>ENGAGE</span></a><button class="mobile-avatar">JS</button></header>
    <main id="main-content" tabindex="-1"><router-outlet/></main>
  </div>
  @if(store.toast()){<div class="toast" role="status"><ui-icon name="check" [size]="20"/>{{store.toast()}}</div>}
</div>
